name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      # The encoder is gated against the decoder as a round-trip oracle, and the
      # AVX2 kernels are gated byte-identical against their scalar/SSSE3 twins.
      # Release mode matters: the SIMD paths are what those oracles compare.
      - name: Test (release)
        run: cargo test --release
      # The no-SIMD, forbid(unsafe_code) configuration must also stay green.
      - name: Test (platform_independent)
        run: cargo test --release --no-default-features --features std,platform_independent

  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imac-unknown-none-elf   # ESP32-C6 class: no std, no 64-bit atomics
          - riscv32imafc-unknown-none-elf  # ESP32-P4 class
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      # The chip build: no std, no libm, no SIMD, no threads.
      - run: cargo check --no-default-features --target ${{ matrix.target }}
      - run: cargo clippy --no-default-features --target ${{ matrix.target }} -- -D warnings
      # The whole suite on the no_std code paths, on the host: the decoder's
      # slice source, the encoder's slice sinks, every knob at its default.
      # `tests/no_std_surface.rs` pins a golden hash that the `std` job must
      # reproduce — that is the host-equals-chip gate.
      - run: cargo test --release --no-default-features
      - run: cargo clippy --release --no-default-features --all-targets -- -D warnings

  aarch64:
    name: aarch64 (NEON kernels)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The NEON quantize kernel cannot be executed on the x86 machine it was
      # written on, so `neon_matches_scalar` — which compares it exhaustively
      # against the scalar oracle — only certifies it HERE. If this job does not
      # run, that kernel is unverified.
      - name: Test (release, NEON)
        run: cargo test --release

  aarch64-crosscheck:
    name: aarch64 (cross-compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      # Cheap backstop that runs everywhere, so an ARM build break is caught even
      # if the ARM runner is unavailable. It proves compilation, NOT behaviour.
      - run: cargo check --target aarch64-unknown-linux-gnu --tests

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # A decoder is a parser for hostile bytes: Err is a correct outcome for a
      # corrupt file, a panic is not. Short runs on every push catch regressions;
      # depth comes from running these targets locally for longer.
      - name: decode
        run: cargo fuzz run decode -- -max_total_time=60 -rss_limit_mb=4096
        working-directory: fuzz
      - name: decode_planar
        run: cargo fuzz run decode_planar -- -max_total_time=60 -rss_limit_mb=4096
        working-directory: fuzz
      - name: roundtrip
        run: cargo fuzz run roundtrip -- -max_total_time=60 -rss_limit_mb=4096
        working-directory: fuzz

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
